<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Pembelajaran Bahasa Arab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #f8f5f0; }
    .arabic { font-family: 'Amiri', serif; direction: rtl; }
    .hidden { display: none; }
    .active { display: block !important; }
    .tab-btn.active { border-bottom: 4px solid #059669; color: #059669; font-weight: bold; }
    input[type="password"] {
      -webkit-text-security: disc;
      text-security: disc;
    }
  </style>
  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
      }
    });
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
</head>
<body class="min-h-screen">
  <!-- Kategori Belajar -->
  <section id="belajar" class="content-section hidden">
    <button onclick="navigateTo('welcome')" class="text-sm text-amber-700 mb-4 flex items-center">
      <i class="ph ph-arrow-left mr-2"></i>Kembali
    </button>
    <h2 class="text-xl font-bold text-amber-700 mb-4">Bahan Pembelajaran Mengikut Kategori</h2>
    <div class="space-y-8">
      <!-- Setiap kategori -->
      <div>
        <h3 class="font-semibold text-amber-600 mb-2">Kata Sapaan & Perkenalan Diri</h3>
        <div class="flex space-x-4">
          <button class="tab-btn" onclick="showTab('sapaan-video')">Video</button>
          <button class="tab-btn" onclick="showTab('sapaan-nota')">Nota</button>
        </div>
        <div id="sapaan-video" class="hidden mt-2">
          <iframe width="100%" height="315" src="https://www.youtube.com/embed/samplevideo1" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="sapaan-nota" class="hidden mt-2">
          <iframe width="100%" height="500" src="https://www.canva.com/design/sample1/embed" frameborder="0"></iframe>
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-amber-600 mb-2">Perkataan Bertema</h3>
        <div class="flex space-x-4">
          <button class="tab-btn" onclick="showTab('bertema-video')">Video</button>
          <button class="tab-btn" onclick="showTab('bertema-nota')">Nota</button>
        </div>
        <div id="bertema-video" class="hidden mt-2">
          <iframe width="100%" height="315" src="https://www.youtube.com/embed/samplevideo2" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="bertema-nota" class="hidden mt-2">
          <iframe width="100%" height="500" src="https://www.canva.com/design/sample2/embed" frameborder="0"></iframe>
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-amber-600 mb-2">Nombor & Jam</h3>
        <div class="flex space-x-4">
          <button class="tab-btn" onclick="showTab('nombor-video')">Video</button>
          <button class="tab-btn" onclick="showTab('nombor-nota')">Nota</button>
        </div>
        <div id="nombor-video" class="hidden mt-2">
          <iframe width="100%" height="315" src="https://www.youtube.com/embed/samplevideo3" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="nombor-nota" class="hidden mt-2">
          <iframe width="100%" height="500" src="https://www.canva.com/design/sample3/embed" frameborder="0"></iframe>
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-amber-600 mb-2">Kata Ganti Nama & Kata Kerja</h3>
        <div class="flex space-x-4">
          <button class="tab-btn" onclick="showTab('ganti-video')">Video</button>
          <button class="tab-btn" onclick="showTab('ganti-nota')">Nota</button>
        </div>
        <div id="ganti-video" class="hidden mt-2">
          <iframe width="100%" height="315" src="https://www.youtube.com/embed/samplevideo4" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="ganti-nota" class="hidden mt-2">
          <iframe width="100%" height="500" src="https://www.canva.com/design/sample4/embed" frameborder="0"></iframe>
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-amber-600 mb-2">Kata Sendi & Kata Arah</h3>
        <div class="flex space-x-4">
          <button class="tab-btn" onclick="showTab('sendi-video')">Video</button>
          <button class="tab-btn" onclick="showTab('sendi-nota')">Nota</button>
        </div>
        <div id="sendi-video" class="hidden mt-2">
          <iframe width="100%" height="315" src="https://www.youtube.com/embed/samplevideo5" frameborder="0" allowfullscreen></iframe>
        </div>
        <div id="sendi-nota" class="hidden mt-2">
          <iframe width="100%" height="500" src="https://www.canva.com/design/sample5/embed" frameborder="0"></iframe>
        </div>
      </div>
    </div>
  </section>
  <script>
    function showTab(tabId) {
      document.querySelectorAll('[id$="-video"], [id$="-nota"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
