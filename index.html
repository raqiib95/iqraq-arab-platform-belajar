<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Pembelajaran Bahasa Arab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #f8f5f0; }
    .arabic { font-family: 'Amiri', serif; direction: rtl; }
    .hidden { display: none; }
    .active { display: block !important; }
    .tab-btn.active { border-bottom: 4px solid #059669; color: #059669; font-weight: bold; }
    input[type="password"] {
      -webkit-text-security: disc;
      text-security: disc;
    }
  </style>
  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
      }
    });
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
</head>
<body class="min-h-screen">
  <div id="login-popup" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-60 z-50">
    <div class="bg-white p-6 rounded shadow-md w-full max-w-md">
      <h2 class="text-xl font-bold text-center text-emerald-700 mb-4">Selamat Datang!</h2>
      <p class="text-center mb-4">Sila masukkan Username dan Password untuk mula.</p>
      <input id="username" type="text" placeholder="Username" class="w-full border border-gray-300 rounded px-4 py-2 mb-3" />
      <input id="password" type="password" placeholder="Password" class="w-full border border-gray-300 rounded px-4 py-2 mb-4" />
      <button onclick="checkLogin()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 w-full rounded">Masuk</button>
      <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden">Maklumat tidak sah atau bayaran belum disahkan.</p>
    </div>
  </div>

  <header class="bg-emerald-700 text-white p-4 text-xl font-bold text-center">
    Platform Pembelajaran Bahasa Arab
  </header>

  <main class="p-6">
    <section id="welcome" class="content-section">
      <h2 class="text-2xl font-bold text-emerald-700 mb-4 text-center">Selamat datang ke platform ini</h2>
      <p class="text-center text-gray-700 mb-6">Nama: <span id="display-username" class="font-semibold"></span></p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl mx-auto">
        <button class="menu-btn bg-emerald-100 hover:bg-emerald-200 p-6 text-center rounded-lg shadow border border-emerald-300" onclick="navigateTo('belajar')">
          <div class="flex flex-col items-center text-emerald-700">
            <i class="ph ph-book-open text-3xl mb-2"></i>
            <span class="text-xl font-bold">Belajar</span>
          </div>
        </button>
        <button class="menu-btn bg-amber-100 hover:bg-amber-200 p-6 text-center rounded-lg shadow border border-amber-300" onclick="navigateTo('permainan')">
          <div class="flex flex-col items-center text-amber-700">
            <i class="ph ph-game-controller text-3xl mb-2"></i>
            <span class="text-xl font-bold">Permainan</span>
          </div>
        </button>
        <button class="menu-btn bg-blue-100 hover:bg-blue-200 p-6 text-center rounded-lg shadow border border-blue-300" onclick="navigateTo('panduan')">
          <div class="flex flex-col items-center text-blue-700">
            <i class="ph ph-bookmarks text-3xl mb-2"></i>
            <span class="text-xl font-bold">Panduan</span>
          </div>
        </button>
        <button class="menu-btn bg-purple-100 hover:bg-purple-200 p-6 text-center rounded-lg shadow border border-purple-300" onclick="navigateTo('sokongan')">
          <div class="flex flex-col items-center text-purple-700">
            <i class="ph ph-lifebuoy text-3xl mb-2"></i>
            <span class="text-xl font-bold">Sokongan</span>
          </div>
        </button>
        <button onclick="logout()" class="col-span-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded shadow border border-red-300 text-center">
          <i class="ph ph-sign-out text-xl mr-2"></i>Log Keluar
        </button>
      </div>
    </section>
  </main>

  <script>
    let currentUsername = '';

    async function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('login-error').textContent = 'Sila masukkan kedua-dua medan.';
        document.getElementById('login-error').classList.remove('hidden');
        return;
      }

      try {
        const response = await fetch('senarai_pengguna.csv');
        const csvText = await response.text();
        const rows = csvText.trim().split('\n').slice(1);
        const users = rows.map(row => {
          const [nama, uname, pw, status] = row.split(',');
          return { nama, username: uname, password: pw, status: status.trim().toLowerCase() === 'true' };
        });

        const user = users.find(u => u.username === username && u.password === password);

        if (user && user.status) {
          currentUsername = user.nama;
          document.getElementById('login-popup').style.display = 'none';
          document.getElementById('display-username').textContent = currentUsername;
        } else {
          document.getElementById('login-error').textContent = 'Maklumat tidak sah atau bayaran belum disahkan.';
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch (err) {
        console.error('Ralat semasa memuat CSV:', err);
        document.getElementById('login-error').textContent = 'Tidak dapat memuat data pengguna.';
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function logout() {
      currentUsername = '';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('display-username').textContent = '';
      document.getElementById('login-popup').style.display = 'flex';
    }

    function navigateTo(sectionId) {
      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
    }

    function showTopik(topikId) {
      document.getElementById('topik-kandungan').classList.remove('hidden');
      document.getElementById('kategori-list').classList.add('hidden');
      switchTab('video');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('active');
    }
  </script>
</body>
</html>
