  <!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Pembelajaran Bahasa Arab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-['Noto Sans']">

  <!-- HEADER -->
  <header class="bg-emerald-700 text-white p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="h-10" />
      <h1 class="text-lg font-semibold">Platform Pembelajaran Bahasa Arab UPKK</h1>
    </div>
    <button id="logout-btn" class="logout-small hidden">Log Keluar</button>
  </header>

  <!-- LOGIN POPUP -->
  <div id="login-popup" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded w-80 shadow-lg">
      <h2 class="text-xl text-emerald-700 font-bold mb-4">Log Masuk</h2>
      <input type="text" id="input-nama" placeholder="Nama pengguna" class="mb-3 w-full p-2 border rounded" />
      <input type="password" id="input-password" placeholder="Katalaluan" class="mb-2 w-full p-2 border rounded" />
      <button onclick="validateLogin()" class="w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">Log Masuk</button>
      <p id="login-error" class="text-red-600 text-sm mt-2 hidden">Nama atau kata laluan salah atau belum berbayar.</p>
    </div>
  </div>

  <!-- MENU UTAMA -->
  <main id="menu-utama" class="hidden p-6">
    <h2 class="text-xl font-semibold text-emerald-700 mb-4">Menu Utama</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
      <button onclick="navigateTo('belajar-section')" class="card text-center">
        <i class="ph-book-open text-2xl mb-2"></i>
        Belajar
      </button>
      <button onclick="navigateTo('permainan-section')" class="card text-center">
        <i class="ph-game-controller text-2xl mb-2"></i>
        Permainan
      </button>
    </div>
  </main>

  <!-- SEKSYEN BELAJAR -->
  <section id="belajar-section" class="content-section hidden p-6">
    <button onclick="navigateTo('menu-utama')" class="mb-4 text-emerald-600 flex items-center">
      <i class="ph-arrow-left mr-1"></i> Kembali ke Menu Utama
    </button>
    <div id="kategori-belajar" class="category-grid"></div>
  </section>

  <!-- SEKSYEN PERMAINAN -->
  <section id="permainan-section" class="content-section hidden p-6">
    <button onclick="navigateTo('menu-utama')" class="mb-4 text-emerald-600 flex items-center">
      <i class="ph-arrow-left mr-1"></i> Kembali ke Menu Utama
    </button>
    <div id="kategori-permainan" class="category-grid"></div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-emerald-700 text-white text-center p-4 mt-8">
    © 2025 Abdul Raqiib bin Basiran & Iqraq Education
  </footer>
